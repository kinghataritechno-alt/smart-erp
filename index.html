<meta name="theme-color" content="#383836">
<meta name="description" content="Smart Office Platform — 3E Enterprise Enablement Ecosystem · SmartTerminal">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --bg:#ECECE8; --surface:#FFFFFF; --surface2:#F6F6F3; --line:#D9D8D2; --ink:#1C1C1A; --mut:#5F5E59; --faint:#9C9C96;
  --char:#383836; --char2:#454542; --char-ink:#EDECE8; --char-mut:#A9A8A2;
  --amber:#E5572B; --amber-soft:#FBE6DE; --budget:#2F5FD0; --budget-soft:#EAF0FC;
  --good:#14915C; --good-soft:#E3F4EA; --crit:#D63E2C; --crit-soft:#FDEAE6; --gold:#C98608; --gold-soft:#FFF4DA;
  --pri:#383836; --pri-h:#454542; --pri-ink:#EDECE8; --accent-ink:#FFFFFF; --logo-bg:#383836;
  --r:10px; --sh:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
  --head:'Anuphan',system-ui,sans-serif; --body:'IBM Plex Sans Thai',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#100F0E; --surface:#1A1917; --surface2:#211F1D; --line:#34322F; --ink:#EDECE8; --mut:#B5B3AC; --faint:#7D7B75;
  --char:#171513; --char2:#22201D; --pri:#EDECE8; --pri-h:#FFFFFF; --pri-ink:#1C1C1A; --accent-ink:#1C1C1A; --logo-bg:#2A2825; --amber:#F7A43A; --amber-soft:#3A2614; --budget:#7FA6FF; --budget-soft:#1A2338;
  --good:#4CC28A; --good-soft:#14281E; --crit:#FF7A6B; --crit-soft:#3A1A16; --gold:#F5B04A; --gold-soft:#33270F;
}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--head);margin:0;line-height:1.3}
h1{font-size:24px} h2{font-size:19px} h3{font-size:16px}
button,input,select{font:inherit;color:inherit}
.mono{font-family:var(--mono);font-size:.92em}
.mut{color:var(--mut)} .faint{color:var(--faint)} .small{font-size:13px}
.hidden{display:none!important}

/* ---------- auth screens ---------- */
.gate{min-height:100%;display:grid;place-items:center;padding:24px 16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);padding:28px;width:100%;max-width:420px}
.brandmark{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.logo{width:42px;height:42px;border-radius:10px;background:var(--logo-bg);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.logo svg{width:28px;height:28px;color:var(--amber)}
.brandtxt b{display:block;font-family:var(--head);font-size:17px;letter-spacing:.04em}
.brandtxt b span{color:var(--amber)}
.brandtxt small{color:var(--mut);font-size:12px}
.field{display:grid;gap:6px;margin:14px 0}
.field label{font-size:13px;font-weight:600;color:var(--mut)}
.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;outline:none}
.inp:focus{border-color:var(--budget);box-shadow:0 0 0 3px var(--budget-soft)}
.inp.code{font-family:var(--mono);font-size:20px;letter-spacing:.3em;text-align:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 16px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
.btn.primary:hover{background:var(--pri-h);border-color:var(--pri-h)}
.btn.accent{background:var(--amber);border-color:var(--amber);color:var(--accent-ink)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.block{width:100%}
.btn:disabled{opacity:.55;cursor:not-allowed}
.msg{border-radius:8px;padding:10px 12px;font-size:14px;margin:12px 0}
.msg.info{background:var(--budget-soft);color:var(--budget)}
.msg.ok{background:var(--good-soft);color:var(--good)}
.msg.err{background:var(--crit-soft);color:var(--crit)}
.msg.warn{background:var(--gold-soft);color:var(--gold)}
.qr{display:grid;place-items:center;background:#fff;border-radius:10px;padding:12px;margin:12px 0}
.qr img{width:190px;height:190px}
.secret{word-break:break-all;background:var(--surface2);border-radius:8px;padding:8px 10px}

/* ---------- app shell ---------- */
.app{display:grid;grid-template-columns:240px 1fr;min-height:100%}
.side{background:var(--char);color:var(--char-ink);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.side .brandmark{padding:0 6px;margin-bottom:18px}
.side .brandtxt small{color:var(--char-mut)}
.side .logo{background:var(--char2);border-color:transparent}
.nav{display:flex;align-items:center;gap:10px;border:0;background:none;color:var(--char-mut);padding:9px 12px;border-radius:8px;text-align:left;cursor:pointer;width:100%;font-weight:500}
.nav:hover{background:var(--char2);color:var(--char-ink)}
.nav[aria-current="page"]{background:var(--char2);color:#fff;box-shadow:inset 3px 0 0 var(--amber)}
.nav svg{width:18px;height:18px;flex:none}
.side .foot{margin-top:auto;font-size:12px;color:var(--char-mut);padding:10px 8px;border-top:1px solid var(--char2)}
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:14px 28px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:5}
.top .co{font-family:var(--head);font-weight:600}
.top .who{margin-left:auto;display:flex;align-items:center;gap:10px;min-width:0}
.top .who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:260px}
.menu-btn{display:none}
.page{padding:26px 28px 60px;max-width:1180px;width:100%}
.ph{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.ph .act{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:18px}
.panel>.hd{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.panel>.bd{padding:16px 18px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.stat small{display:block;color:var(--mut);font-size:12px}
.stat b{font-family:var(--head);font-size:24px;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-weight:600;color:var(--mut);font-size:12px;text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface2)}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.mono{white-space:nowrap}
tr.clk{cursor:pointer}
.nbadge{margin-left:auto;background:var(--amber);color:var(--accent-ink);border-radius:99px;font-size:11px;font-weight:700;padding:1px 7px;line-height:18px}
.thr{display:flex;flex-direction:column;gap:10px;max-height:420px;overflow:auto;padding:4px 2px}

/* ---------- login scene ---------- */
.lg{position:fixed;inset:0;overflow:hidden;background:#0d0c0b}
.lg::before{content:"";position:absolute;inset:-40px;background:var(--gate-bg) center/cover;filter:blur(24px) brightness(.55)}
.lg-stage{position:absolute;left:0;top:0;transform-origin:0 0;background-size:100% 100%;background-repeat:no-repeat}
.lg-stage>*,.lg-stage form>*{position:absolute;margin:0}
.lg-in{border:0;background:transparent;color:#fff;font:500 var(--fs)/1.2 var(--body);padding:0 6px;outline:none;caret-color:#F7953A;-webkit-text-fill-color:#fff}
.lg-in::placeholder{color:rgba(255,255,255,.62);-webkit-text-fill-color:rgba(255,255,255,.62)}
.lg-in:-webkit-autofill{-webkit-box-shadow:0 0 0 100px rgba(30,28,27,.98) inset;transition:background-color 9999s}
.lg-ring{pointer-events:none;border-radius:var(--rad);transition:box-shadow .15s}
.lg-in:focus+.lg-ring{box-shadow:0 0 0 3px rgba(247,149,58,.95),0 0 26px rgba(247,120,40,.45)}
.lg-eye,.lg-help{border:0;background:transparent;cursor:pointer;border-radius:var(--rad)}
.lg-eye:focus-visible,.lg-help:focus-visible,.lg-btn:focus-visible{outline:3px solid rgba(255,255,255,.85);outline-offset:3px}
.lg-btn{border:0;background:transparent;cursor:pointer;border-radius:calc(var(--rad) * 1.1);color:#fff;font:600 calc(var(--fs) * 1.05) var(--head);transition:box-shadow .15s,filter .15s}
.lg-btn:hover{box-shadow:0 0 34px rgba(247,120,40,.55)}
.lg-btn:active{filter:brightness(.92)}
.lg-btn span{display:none}
.lg-btn.busy{background:linear-gradient(90deg,#F99A3D,#EE5B1E);cursor:wait}
.lg-btn.busy span{display:inline}
.lg-msg{display:flex;align-items:center;padding:0 12px;border-radius:calc(var(--rad) * .8);font:500 calc(var(--fs) * .78)/1.35 var(--body);background:rgba(22,20,19,.99);color:#fff;border:1px solid rgba(255,255,255,.12)}
.lg-msg.err{color:#FFB4A6;border-color:rgba(255,122,107,.55)}
.lg-msg.info{color:#FFE2C4}
.lg-msg[hidden]{display:none}
/* other sign-in steps (change password, MFA, setup) sit on the same scene */
.gate{position:relative;background:#0d0c0b;color-scheme:dark;isolation:isolate;
  --surface:#1A1917; --surface2:#211F1D; --line:#3a3733; --ink:#EDECE8; --mut:#B5B3AC; --faint:#8a877f; --pri:#EDECE8; --pri-h:#fff; --pri-ink:#1C1C1A; --amber:#F7953A; --accent-ink:#1C1C1A; --budget:#7FA6FF; --budget-soft:#1A2338;
  --good:#4CC28A; --good-soft:#14281E; --crit:#FF7A6B; --crit-soft:#3A1A16; --gold:#F5B04A; --gold-soft:#33270F; color:var(--ink)}
.gate::before{content:"";position:fixed;inset:-60px;z-index:-1;background:var(--gate-bg) center/cover;filter:blur(22px) brightness(.5) saturate(1.15)}
.gate .card{background:rgba(26,25,23,.72);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-color:rgba(255,255,255,.14);box-shadow:0 0 0 1px rgba(247,149,58,.25),0 30px 80px rgba(0,0,0,.5)}

/* ===== device views ===== */
.nav .s,.tabbar{display:none}
.tab{border:0;background:none;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;padding:6px 2px;position:relative;cursor:pointer;flex:1;min-width:0}

dialog.sheet .sheet-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:8px 0 14px}
.sheet-it{display:flex;flex-direction:column;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:14px 6px;font-size:13px;font-weight:600;cursor:pointer;text-align:center;color:var(--ink)}

/* tables → cards (added by JS on mobile, and on tablet when a table is wider than its panel) */
/* tables → cards */
table.cards thead{display:none}

table.cards td::before{content:attr(data-label);grid-column:1;grid-row:1/span 30;justify-self:start;color:var(--mut);font-size:12px;font-weight:600;text-align:left;max-width:40vw}

.tw:has(table.cards){overflow:visible}
.btn-out{display:inline-flex;align-items:center;gap:6px;color:var(--crit);border-color:color-mix(in srgb,var(--crit) 45%,var(--line))}

.bu-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-bottom:18px}

@media (max-width:760px){ .bu-cards{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-left:12px;margin:0 -12px 14px;padding:0 12px 4px} .bu-card{flex:0 0 66%;scroll-snap-align:start} }
/* dashboards */
.seg button svg{width:15px;height:15px;vertical-align:-2px;margin-right:4px}
.seg.sm button{padding:3px 9px;font-size:12px}
.dg{display:grid;gap:18px;grid-template-columns:minmax(0,1fr);margin-bottom:18px}
.dg>.panel,.dg-col>.panel{margin:0}
.dg-col{display:grid;gap:18px;align-content:start;min-width:0}
.panel.mt{margin-top:0}
.hb{display:grid;gap:9px}
.hb-r{display:grid;grid-template-columns:minmax(80px,36%) minmax(40px,1fr) auto;gap:10px;align-items:center;font-size:13px}
.hb-r.clk{cursor:pointer;border-radius:6px} .hb-r.clk:hover .hb-l,.hb-r.on .hb-l{color:var(--amber)} .hb-r.on .hb-l{font-weight:700}
.hb-l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb-t{height:10px;background:var(--surface2);border-radius:5px;overflow:hidden} .hb-t i{display:block;height:100%;border-radius:5px}
.hb-v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;min-width:52px;line-height:1.25} .hb-v small{display:block;font-weight:400;color:var(--faint);font-size:11px;white-space:nowrap}
.cc{display:flex;align-items:flex-end;gap:4px;overflow-x:auto;padding:2px 0 4px}
.cc-c{flex:1 0 26px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:26px}
.cc-b{height:var(--h);width:72%;max-width:48px;display:flex;flex-direction:column-reverse;background:var(--surface2);border-radius:6px 6px 2px 2px;overflow:hidden}

.cc-v{font-size:10.5px;color:var(--mut);white-space:nowrap;font-variant-numeric:tabular-nums;min-height:14px}
.cc-l{font-size:11px;color:var(--mut);white-space:nowrap}
.lgd{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--mut);margin-top:10px}
.lgd span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;background:var(--c)}
.dn{display:flex;gap:18px;align-items:center;flex-wrap:wrap}

.dn-lg span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dn-lg i{width:10px;height:10px;border-radius:3px} .dn-lg b{font-variant-numeric:tabular-nums} .dn-lg small{color:var(--faint);text-align:right}
@media (min-width:761px){ .dg{grid-template-columns:repeat(2,minmax(0,1fr))} .dg .w2{grid-column:1/-1} }

@media (max-width:760px){ .dn-c{width:120px;height:120px} .dn-h{width:76px;height:76px} .ph .act>.seg{flex:1 1 100%;display:flex} .ph .act .seg button{flex:1} .cc-c{min-width:32px} .cc-l{font-size:10px} }
/* procurement summary */
.ps-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-bottom:18px}

/* PC ≥1200: wide canvas + multi-column workspaces */
@media (min-width:1200px){
  .app{grid-template-columns:256px 1fr}
  .page{max-width:1640px;padding:28px 36px 64px}
  .stats{grid-template-columns:repeat(4,1fr)}
  .dash{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start}
  .pj-grid{display:grid;grid-template-columns:minmax(0,1fr) 440px;grid-template-areas:"main files" "main thr";gap:0 18px;align-items:start}
  .pj-main{grid-area:main;min-width:0} .pj-files{grid-area:files;min-width:0} .pj-thr{grid-area:thr;position:sticky;top:76px;min-width:0}
  .pj-thr .thr{max-height:calc(100vh - 330px)}

}

  .app{grid-template-columns:88px 1fr}

/* Mobile ≤760: bottom tabs, card tables, bottom-sheet dialogs */
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .side,.menu-btn{display:none!important}

function loginArtKey(){ const ar = innerWidth / innerHeight, d = k => Math.abs(Math.log(ar / (LOGIN_ART[k].w / LOGIN_ART[k].h))); return ['m','t','p'].sort((a, b) => d(a) - d(b))[0]; }
function setGateBg(){ document.documentElement.style.setProperty('--gate-bg', `url("${LOGIN_ART[loginArtKey()].src}")`); }
function viewLogin(note){
  let last = ''; try { last = localStorage.getItem('sop.user') || '' } catch(e){}
  const keep = { un: $('#un')?.value, pw: $('#pw')?.value };
  const k = S.lgKey = loginArtKey(), A = LOGIN_ART[k]; setGateBg();
  const R = (r, pad = 0) => `left:${r[0] - pad}px;top:${r[1] - pad}px;width:${r[2] - r[0] + 2 * pad}px;height:${r[3] - r[1] + 2 * pad}px`;
  const fh = A.user[3] - A.user[1], fs = Math.round(fh * .31), rad = Math.round(fh * .2);
  root().innerHTML = `<div class="lg" id="lg"><div class="lg-stage" id="lg-stage" style="width:${A.w}px;height:${A.h}px;background-image:url('${A.src}');--fs:${fs}px;--rad:${rad}px">
    <div class="lg-msg" id="lg-msg" role="status" aria-live="polite" style="${R(A.msg)}" hidden></div>
    <form id="f-login" autocomplete="on" novalidate>
      <input id="un" class="lg-in" aria-label="ชื่อผู้ใช้ (ชื่อ-สกุลพนักงาน)" autocomplete="username" autocapitalize="off" spellcheck="false" placeholder="Username : ชื่อสกุล"
        style="left:${A.txt}px;top:${A.user[1] + 4}px;width:${A.user[2] - 14 - A.txt}px;height:${fh - 8}px">
      <i class="lg-ring" style="${R(A.user, 1)}"></i>
      <input id="pw" class="lg-in" type="password" aria-label="รหัสผ่าน" autocomplete="current-password" placeholder="Password : erp + รหัสพนักงาน"
        style="left:${A.txt}px;top:${A.pw[1] + 4}px;width:${A.eye[0] - 8 - A.txt}px;height:${A.pw[3] - A.pw[1] - 8}px">
      <i class="lg-ring" style="${R(A.pw, 1)}"></i>
      <button type="button" class="lg-eye" id="lg-eye" aria-label="แสดงรหัสผ่าน" style="${R(A.eye)}"></button>
      <button class="lg-btn" id="b-login" aria-label="เข้าสู่ระบบ" style="${R(A.btn)}"><span>กำลังเข้าสู่ระบบ…</span></button>
    </form>
    <button type="button" class="lg-help" id="lg-help" aria-label="มีปัญหาในการเข้าสู่ระบบ" style="${R(A.help)}"></button>
  </div></div>`;
  const msg = (cls, text) => { const m = $('#lg-msg'); m.className = 'lg-msg ' + cls; m.textContent = text; m.hidden = !text; };
  if (note) msg(note[0], note[1]);
  $('#un').value = keep.un ?? last; if (keep.pw) $('#pw').value = keep.pw;
  S.lgW = innerWidth; layoutLogin();
  setTimeout(() => (($('#un').value && !keep.un) ? $('#pw') : $('#un')).focus({ preventScroll:true }), 50);
  $('#lg-eye').onclick = () => { const p = $('#pw'), show = p.type === 'password'; p.type = show ? 'text' : 'password'; $('#lg-eye').setAttribute('aria-label', show ? 'ซ่อนรหัสผ่าน' : 'แสดงรหัสผ่าน'); p.focus(); };
  $('#lg-help').onclick = () => msg('info', 'ชื่อผู้ใช้ = ชื่อ-สกุล ไม่ต้องมีคำนำหน้า · ชื่อซ้ำให้ใช้รหัสพนักงาน · ลืมรหัส แจ้งผู้ดูแลระบบให้รีเซ็ต');
  $('#f-login').onsubmit = async ev => {
    ev.preventDefault();
    const user = $('#un').value.trim(), password = $('#pw').value;
    if (!user) { msg('err', 'กรอกชื่อผู้ใช้'); return $('#un').focus(); }
    if (!password) { msg('err', 'กรอกรหัสผ่าน'); return $('#pw').focus(); }
    const b = $('#b-login'); b.disabled = true; b.classList.add('busy'); msg('', ''); primeVoice();
    const done = (t) => { b.disabled = false; b.classList.remove('busy'); msg('err', t); $('#pw').select(); };
    const { data: email, error: e1 } = await sb.rpc('login_email', { p_username: user });
    if (e1) return done('เชื่อมต่อระบบไม่ได้ ลองใหม่อีกครั้ง');
    if (email === 'AMBIGUOUS') return done('มีพนักงานชื่อนี้มากกว่า 1 คน — ใช้รหัสพนักงานเป็นชื่อผู้ใช้แทน');
    if (!email) return done('ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง');
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error) return done('ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง');
    try { localStorage.setItem('sop.user', user) } catch(e){}
    S.greetPending = true;
    route();
  };
}
function layoutLogin(){
  const st = $('#lg-stage'); if (!st) return;
  const A = LOGIN_ART[S.lgKey], W = innerWidth, H = innerHeight, m = 10, [cx0, cy0, cx1, cy1] = A.card;
  let s = Math.max(W / A.w, H / A.h);
  s = Math.min(s, (W - 2 * m) / (cx1 - cx0), (H - 2 * m) / (cy1 - cy0));       // never crop the card
  const fit = (view, img, c0, c1) => {                                          // centre the art, then pan so the card stays on screen
    let o = (view - img * s) / 2;
    if (o + c0 * s < m) o = m - c0 * s;
    if (o + c1 * s > view - m) o = view - m - c1 * s;
    return img * s >= view ? Math.min(0, Math.max(view - img * s, o)) : o;
  };
  st.style.transform = `translate(${fit(W, A.w, cx0, cx1)}px,${fit(H, A.h, cy0, cy1)}px) scale(${s})`;
}
setGateBg();
addEventListener('resize', () => {
  if (!$('#lg-stage')) return setGateBg();
  if (innerWidth === S.lgW && document.activeElement?.classList.contains('lg-in')) return;   // phone keyboard opened: keep the scene still
  S.lgW = innerWidth;
  if (loginArtKey() !== S.lgKey) viewLogin(); else layoutLogin();
});

/* บัญชีที่เห็นเงิน/อนุมัติ: ต้องผ่านขั้นนี้ก่อน ฐานข้อมูลจึงยอมให้เห็นข้อมูล */
async function securityGate(){
  const { data: sec, error } = await sb.rpc('my_security', { p_company: S.cid });
  if (error) { fail(error); return false; }
  if (sec.ok) return true;
  if (sec.default_password) { viewChangePw(true); return false; }
  const { data: aal } = await sb.auth.mfa.getAuthenticatorAssuranceLevel();
  if (aal && aal.nextLevel === 'aal2' && aal.currentLevel !== 'aal2') viewMfaChallenge(); else viewMfaEnroll();
  return false;
}

/* voice greeting after a successful login (Web Speech API, no server, nothing recorded) */
const voiceOn = () => { try { return localStorage.getItem('sop.voice') !== 'off'; } catch(e){ return true; } };
function primeVoice(){ try { if (!voiceOn() || !window.speechSynthesis) return; speechSynthesis.getVoices(); const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } catch(e){} }
function greetVoice(){
  if (!voiceOn() || !window.speechSynthesis) return;
  const hr = +new Intl.DateTimeFormat('en-GB', { timeZone:'Asia/Bangkok', hour:'numeric', hourCycle:'h23' }).format(new Date());
  const part = hr < 5 ? 'สวัสดี' : hr < 12 ? 'สวัสดีตอนเช้า' : hr < 13 ? 'สวัสดีตอนกลางวัน' : hr < 17 ? 'สวัสดีตอนบ่าย' : hr < 19 ? 'สวัสดีตอนเย็น' : 'สวัสดีตอนค่ำ';
  const full = (S.user?.user_metadata?.full_name || '').replace(/^(นางสาว|นาง|นาย|น\.ส\.|ดร\.|Mr\.?|Mrs\.?|Ms\.?)\s*/i, '').trim();
  const first = /@/.test(full) ? '' : full.split(/\s+/)[0];
  const day = new Date().toLocaleDateString('th-TH', { timeZone:'Asia/Bangkok', weekday:'long', day:'numeric', month:'long' });
  const text = `${part} ${first ? 'คุณ' + first : ''} ยินดีต้อนรับเข้าสู่ Smart Office Platform วันนี้${day}`;
  S.greetText = text;
  const say = () => {
    const vs = speechSynthesis.getVoices(), v = vs.find(x => /^th/i.test(x.lang) && /google|premium|enhanced/i.test(x.name)) || vs.find(x => /^th/i.test(x.lang));
    const u = new SpeechSynthesisUtterance(text); u.lang = 'th-TH'; if (v) u.voice = v; u.rate = 1; u.pitch = 1;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  };
  if (speechSynthesis.getVoices().length) return say();
  let done = false; const once = () => { if (done) return; done = true; speechSynthesis.onvoiceschanged = null; say(); };
  speechSynthesis.onvoiceschanged = once; setTimeout(once, 700);
}
function toggleVoice(){
  const on = !voiceOn(); try { localStorage.setItem('sop.voice', on ? 'on' : 'off'); } catch(e){}
  document.querySelectorAll('[data-voice]').forEach(b => { b.setAttribute('aria-pressed', on); b.title = on ? 'เสียงทักทาย: เปิด (กดเพื่อปิด)' : 'เสียงทักทาย: ปิด (กดเพื่อเปิด)'; b.innerHTML = on ? ICON.vol : ICON.mute; });
  toast(on ? 'เปิดเสียงทักทายแล้ว' : 'ปิดเสียงทักทายแล้ว'); if (on) greetVoice(); else window.speechSynthesis?.cancel();
}
const voiceBtn = () => `<button class="btn sm ghost" data-voice aria-pressed="${voiceOn()}" title="${voiceOn() ? 'เสียงทักทาย: เปิด (กดเพื่อปิด)' : 'เสียงทักทาย: ปิด (กดเพื่อเปิด)'}" aria-label="เสียงทักทาย">${voiceOn() ? ICON.vol : ICON.mute}</button>`;

async function loadCompanies(){
  const { data, error } = await sb.rpc('my_companies');
  if (error) return fail(error);
  const mine = data.filter(r => r.company_id);
  if (!mine.length) {
    const any = data[0]?.any_company;
    return any ? viewNoAccess() : viewBootstrap();
  }
  const invited = mine.find(r => r.status === 'invited');
  const active = mine.filter(r => r.status === 'active');
  if (!active.length && invited) return viewAccept(invited);
  let pick = null; try { pick = localStorage.getItem('sop.cid') } catch(e){}
  const c = active.find(r => r.company_id === pick) || active[0];
  S.companies = active; S.cid = c.company_id; S.company = c; S.isOwner = c.role === 'owner';
  if (!(await securityGate())) return;
  await loadContext(); renderApp();
  if (S.greetPending) { S.greetPending = false; greetVoice(); }
}

async function loadContext(){
  const [p, cat, perm, bus] = await Promise.all([
    sb.rpc('my_permissions', { p_company: S.cid }),
    S.catalog ? { data: S.catalog } : sb.from('positions').select('*').order('code'),
    S.permRows ? { data: S.permRows } : sb.from('position_permissions').select('*'),
    sb.from('business_units').select('id,code,name').eq('company_id', S.cid).eq('active', true).order('code')
  ]);
  if (p.error) return fail(p.error);
  S.perms = {}; S.positions = [];
  for (const r of p.data) { S.perms[r.module] = r; for (const c of (r.positions || [])) if (!S.positions.includes(c)) S.positions.push(c); }
  S.catalog = cat.data || []; S.permRows = perm.data || []; S.bus = bus.data || [];
}

/* mobile: label every table cell with its column header so CSS can render rows as cards */
function labelTables(){
  document.querySelectorAll('#page table, dialog table').forEach(t => {
    const hs = [...t.querySelectorAll('thead th')].map(th => th.textContent.trim());
    if (!hs.length) return;
    t.querySelectorAll('tbody tr').forEach(tr => [...tr.children].forEach((td, i) => { if (!td.hasAttribute('data-label')) td.setAttribute('data-label', hs[i] || ''); }));
    t.classList.remove('cards');
    if (S.view === 'mob' || (S.view === 'tab' && t.scrollWidth > t.parentElement.clientWidth + 4)) t.classList.add('cards');
  });
}
addEventListener('resize', () => { clearTimeout(labelTables.t); labelTables.t = setTimeout(labelTables, 120); });
new MutationObserver(() => { clearTimeout(labelTables.t); labelTables.t = setTimeout(labelTables, 30); }).observe(document.documentElement, { childList:true, subtree:true });

function letters(r){
  if (!r) return '<span class="pm n">—</span>';
  const out = [];
  if (r.v) out.push('<span class="pm v">V</span>');
  if (r.c) out.push('<span class="pm c">C</span>'); if (r.e) out.push('<span class="pm c">E</span>'); if (r.x) out.push('<span class="pm c">X</span>');
  if (r.r) out.push('<span class="pm r">R</span>'); if (r.a) out.push('<span class="pm a">A*</span>');
  return out.join(' ') || '<span class="pm n">—</span>';
}

function dialog(title, body, okLabel, onOk){
  const d = document.createElement('dialog');
  d.innerHTML = `<form method="dialog"><div class="hd"><h3>${h(title)}</h3></div><div class="bd">${body}</div>
    <div class="ft"><button class="btn" value="cancel" formnovalidate>ยกเลิก</button><button class="btn primary" value="ok">${h(okLabel)}</button></div></form>`;
  document.body.appendChild(d); d.showModal();
  d.querySelector('form').addEventListener('submit', async ev => {
    if (ev.submitter?.value !== 'ok') return;
    ev.preventDefault();
    const btn = ev.submitter; btn.disabled = true;
    try { const done = await onOk(d); if (done !== false) d.close(); } catch(e){ fail(e); }
    btn.disabled = false;
  });
  d.addEventListener('close', () => d.remove());
  return d;
}

async function sha256hex(buf){ const d = await crypto.subtle.digest('SHA-256', buf); return [...new Uint8Array(d)].map(b => b.toString(16).padStart(2, '0')).join(''); }
async function putFile({ pid, kind, name, blob, type, at }){
  const ext = (name.match(/\.([a-z0-9]{1,6})$/i) || [, 'bin'])[1].toLowerCase();
  const path = `${S.cid}/${pid}/${crypto.randomUUID()}.${ext}`;
  const up = await sb.storage.from('files').upload(path, blob, { contentType: type || blob.type || 'application/octet-stream', upsert:false });
  if (up.error) throw up.error;
  const row = { company_id:S.cid, project_id:pid, module:FILE_MOD[kind] || 'project', kind, storage_path:path, name, size:blob.size, mime:type || blob.type || null, uploaded_by:S.user.id };
  if (at) row.uploaded_at = at;
  const { error } = await sb.from('files').insert(row);
  if (error) { await sb.storage.from('files').remove([path]); throw error; }
}

        if (!window.JSZip) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js');
        const z = await JSZip.loadAsync(f);
        for (const e of Object.values(z.files)) if (!e.dir) blobs.push({ name:e.name.split('/').pop(), buf: await e.async('arraybuffer') });
      } else blobs.push({ name:f.name, buf: await f.arrayBuffer() });
    }
    const codes = [...new Set(LEGACY_FILES.map(x => x.p))];
    const P = await sb.from('projects').select('id,code').eq('company_id', S.cid).in('code', codes); if (P.error) throw P.error;
    const pidOf = Object.fromEntries(P.data.map(x => [x.code, x.id]));
    const E = await sb.from('files').select('project_id,name').eq('company_id', S.cid).in('project_id', Object.values(pidOf)); if (E.error) throw E.error;
    const have = new Set(E.data.map(x => x.project_id + '|' + x.name));
    let ok = 0, skip = 0, miss = 0;
    for (const b of blobs) {
      const sha = await sha256hex(b.buf), m = LEGACY_FILES.find(x => x.s === sha);
      if (!m) { miss++; log(`✗ ${b.name} — ไม่ตรงกับไฟล์ในระบบเดิม ข้าม`); continue; }
      const pid = pidOf[m.p]; if (!pid) { miss++; log(`✗ ${m.n} — ไม่พบโครงการ ${m.p}`); continue; }
      if (have.has(pid + '|' + m.n)) { skip++; log(`• ${m.p} ${m.n} — มีแล้ว`); continue; }
      await putFile({ pid, kind:m.k, name:m.n, blob:new Blob([b.buf], { type:m.t }), type:m.t, at:m.at });
      have.add(pid + '|' + m.n); ok++; log(`✓ ${m.p} ${m.n}`);
    }
    log(`\nนำเข้า ${ok} · มีแล้ว ${skip} · ไม่ตรง ${miss} (ระบบเดิมมีทั้งหมด ${LEGACY_FILES.length} ไฟล์)`);
    toast(`นำเข้าไฟล์ ${ok} ไฟล์`); after(); return false;
  });
}

const THR_NOTE = 'ข้อความในกระทู้ไม่ถือเป็นการอนุมัติ — อนุมัติ/ตีกลับต้องกดปุ่มในระบบเท่านั้น';
async function threadPeople(){ if (!S.people) { const { data } = await sb.rpc('thread_people', { p_company: S.cid }); S.people = data || []; } return S.people; }
async function threadIndex(){
  const [M, R] = await Promise.all([
    sb.from('messages').select('ref,label,project_id,author_id,author_name,body,mentions,created_at').eq('company_id', S.cid).order('created_at', { ascending:false }).limit(1000),
    sb.from('message_reads').select('ref,seen_at').eq('company_id', S.cid)]);
  if (M.error) throw M.error;
  const seen = Object.fromEntries((R.data || []).map(r => [r.ref, r.seen_at])), me = S.user.id, idx = {};
  for (const m of M.data) {
    const t = idx[m.ref] ||= { ref:m.ref, label:m.label, project_id:m.project_id, last:m, n:0, unread:0, mention:0 };
    t.n++;
    if (m.author_id !== me && (!seen[m.ref] || m.created_at > seen[m.ref])) { t.unread++; if ((m.mentions || []).includes(me)) t.mention++; }
  }
  S.thrIdx = idx; return idx;
}
S.thrListeners = new Set();
function ensureRealtime(){
  if (!sb.channel || S.rtCid === S.cid) return;

  S.rt = sb.channel('msgs-' + S.cid).on('postgres_changes', { event:'INSERT', schema:'public', table:'messages', filter:`company_id=eq.${S.cid}` }, ({ new: m }) => {
    for (const f of [...S.thrListeners]) f(m);

async function refreshThreadBadge(){

const thrAgo = d => { const s = (Date.now() - new Date(d)) / 1000; return s < 60 ? 'เมื่อสักครู่' : s < 3600 ? `${Math.floor(s / 60)} นาทีที่แล้ว` : s < 86400 ? `${Math.floor(s / 3600)} ชม.ที่แล้ว` : new Date(d).toLocaleString('th-TH', { dateStyle:'medium', timeStyle:'short' }); };

/* mount a thread into `box`; returns nothing. ref = project:<id> | pr:<id> | po:<id> | general */
async function mountThread(box, ref){
  box.innerHTML = `<p class="small faint" style="margin:0 0 8px">${THR_NOTE}</p><div class="thr"><div class="empty">กำลังโหลด…</div></div>
    <div class="thr-compose"><textarea class="inp" maxlength="4000" placeholder="พิมพ์ข้อความ… (Ctrl+Enter ส่ง)"></textarea>
      <select class="inp" style="width:auto" title="แท็กคน"><option value="">@ แท็ก</option></select><button class="btn primary">ส่ง</button></div>`;
  const list = $('.thr', box), ta = $('textarea', box), sel = $('select', box), btn = $('.thr-compose .btn', box);
  const people = await threadPeople();
  sel.innerHTML += people.filter(p => p.user_id !== S.user.id).map(p => `<option value="${p.user_id}">${h(p.full_name)}${p.positions ? ' · ' + h(p.positions) : ''}</option>`).join('');
  sel.onchange = () => { const p = people.find(x => x.user_id === sel.value); if (p) { ta.value += (ta.value && !/\s$/.test(ta.value) ? ' ' : '') + '@' + p.full_name + ' '; ta.focus(); } sel.value = ''; };
  const load = async () => {
    const { data, error } = await sb.from('messages').select('id,author_id,author_name,author_role,body,mentions,created_at').eq('company_id', S.cid).eq('ref', ref).order('created_at').limit(500);
    if (error) return fail(error);
    list.innerHTML = data.length ? data.map(m => msgHtml(m, people)).join('') : '<div class="empty" style="padding:8px">ยังไม่มีข้อความ — เริ่มคุยได้เลย</div>';
    list.scrollTop = list.scrollHeight;
    await sb.from('message_reads').upsert({ user_id:S.user.id, company_id:S.cid, ref, seen_at:new Date().toISOString() });
    refreshThreadBadge();
  };
  const send = async () => {
    const body = ta.value.trim(); if (!body) return;
    const mentions = people.filter(p => body.includes('@' + p.full_name)).map(p => p.user_id);
    btn.disabled = true;
    const { error } = await sb.from('messages').insert({ company_id:S.cid, ref, body, mentions });
    btn.disabled = false;
    if (error) return fail(error);
    ta.value = ''; load();

  S.thrListeners.add(live);

  await load();
}

/* ---------- dashboard kit (pure CSS / conic-gradient, no chart library) ---------- */
const PAL = ['var(--amber)','var(--budget)','var(--good)','var(--gold)','#8E6CB8','#2E9C9A','#B4664A','#6B7A8F','#C9467A','#7A9A2E','#D08C60','#4F6D7A'];
const nfmt = v => { const n = Number(v || 0), a = Math.abs(n);
  return a >= 1e6 ? (n / 1e6).toLocaleString('th-TH', { maximumFractionDigits: a >= 1e8 ? 0 : a >= 1e7 ? 1 : 2 }) + ' ล.'
    : a >= 1e4 ? (n / 1e3).toLocaleString('th-TH', { maximumFractionDigits: a >= 1e5 ? 0 : 1 }) + ' พ.'
    : n.toLocaleString('th-TH', { maximumFractionDigits: 0 }); };
const cnt = v => Number(v || 0).toLocaleString('th-TH');
const pctOf = (a, b) => b ? (a / b * 100).toFixed(a / b >= 0.1 ? 0 : 1) + '%' : '—';
const dvIs = (key, def = 'dash') => ((S.dv ||= {})[key] || def) === 'dash';
const dvSeg = (key, listLabel, def = 'dash') => { const cur = (S.dv ||= {})[key] || def;
  return `<div class="seg" role="group" aria-label="มุมมอง"><button data-dv="${key}:dash" aria-pressed="${cur === 'dash'}">${ICON.dash}<span>Dashboard</span></button><button data-dv="${key}:list" aria-pressed="${cur === 'list'}">${h(listLabel)}</button></div>`; };
const bindDv = fn => document.querySelectorAll('[data-dv]').forEach(b => b.onclick = () => { const [k, v] = b.dataset.dv.split(':'); (S.dv ||= {})[k] = v; fn(); });
const countBy = (arr, f) => { const m = new Map(); for (const x of arr) { const k = f(x); m.set(k, (m.get(k) || 0) + 1); } return [...m].sort((a, b) => b[1] - a[1]); };
const sumBy = (arr, f, v) => { const m = new Map(); for (const x of arr) { const k = f(x); m.set(k, (m.get(k) || 0) + Number(v(x) || 0)); } return [...m].sort((a, b) => b[1] - a[1]); };
const topN = (pairs, n, other = 'อื่น ๆ') => pairs.length <= n ? pairs : [...pairs.slice(0, n - 1), [other, pairs.slice(n - 1).reduce((a, x) => a + x[1], 0)]];
/* horizontal bars: rows = [{k, label, v, sub, color}] */
function hbars(rows, { fmt = nfmt, click = false, on = null, color } = {}){
  if (!rows.length) return '<div class="empty">ไม่มีข้อมูล</div>';
  const max = Math.max(1, ...rows.map(r => r.v));
  return `<div class="hb">${rows.map((r, i) => `<div class="hb-r${click ? ' clk' : ''}${on != null && on === (r.k ?? r.label) ? ' on' : ''}" ${click ? `data-hb="${h(r.k ?? r.label)}" role="button" tabindex="0"` : ''}>
    <div class="hb-l" title="${h(r.label)}">${h(r.label)}</div><div class="hb-t"><i style="width:${Math.max(r.v ? 1.5 : 0, r.v / max * 100)}%;background:${r.color || color || PAL[0]}"></i></div>
    <div class="hb-v">${fmt(r.v)}${r.sub ? `<small>${r.sub}</small>` : ''}</div></div>`).join('')}</div>`;
}
/* stacked column chart: cols = [{label, segs:[n…]}], series = names */
function colChart(cols, series = [''], { fmt = nfmt, ht = 170, colors = PAL } = {}){
  if (!cols.length) return '<div class="empty">ไม่มีข้อมูล</div>';
  const max = Math.max(1, ...cols.map(c => c.segs.reduce((a, b) => a + b, 0)));
  return `<div class="cc" style="--h:${ht}px">${cols.map(c => { const t = c.segs.reduce((a, b) => a + b, 0);
    return `<div class="cc-c" title="${h(c.label)} · ${fmt(t)}"><div class="cc-v">${t ? fmt(t) : ''}</div><div class="cc-b">${c.segs.map((v, i) => v ? `<i style="height:${v / max * 100}%;background:${colors[i % colors.length]}" title="${h(series[i] || c.label)}: ${fmt(v)}"></i>` : '').join('')}</div><div class="cc-l">${h(c.label)}</div></div>`; }).join('')}</div>
    ${series.length > 1 ? legendH(series, colors) : ''}`;
}
const legendH = (names, colors = PAL) => `<div class="lgd">${names.map((n, i) => `<span style="--c:${colors[i % colors.length]}">${h(n)}</span>`).join('')}</div>`;
/* donut: segs = [[label, value]] */
function donut(segs, { fmt = cnt, center, sub = '', colors = PAL } = {}){
  const tot = segs.reduce((a, x) => a + x[1], 0);
  if (!tot) return '<div class="empty">ไม่มีข้อมูล</div>';
  let acc = 0; const stops = segs.map(([, v], i) => { const a = acc / tot * 100; acc += v; return `${colors[i % colors.length]} ${a}% ${acc / tot * 100}%`; }).join(',');
  return `<div class="dn"><div class="dn-c" style="background:conic-gradient(${stops})" role="img" aria-label="${h(segs.map(s => s[0] + ' ' + fmt(s[1])).join(', '))}"><div class="dn-h"><b>${center ?? fmt(tot)}</b><small>${h(sub)}</small></div></div>
    <div class="dn-lg">${segs.map(([l, v], i) => `<div><i style="background:${colors[i % colors.length]}"></i><span title="${h(l)}">${h(l)}</span><b>${fmt(v)}</b><small>${pctOf(v, tot)}</small></div>`).join('')}</div></div>`;
}
const stat = (label, value, sub = '', tone = '') => `<div class="stat"><small>${label}</small><b style="${tone ? `color:var(--${tone})` : ''}">${value}</b>${sub ? `<small>${sub}</small>` : ''}</div>`;
const pnl = (title, body, { cls = '', note = '', act = '' } = {}) => `<div class="panel ${cls}"><div class="hd"><h3>${title}</h3>${note ? `<span class="small mut">${note}</span>` : ''}${act ? `<div style="margin-left:auto">${act}</div>` : ''}</div><div class="bd">${body}</div></div>`;
const ymLabel = ym => { const [y, m] = ym.split('-'); return `${TH_MON[+m - 1]} ${String(+y + 543).slice(2)}`; };
const dashHead = (title, desc, key, listLabel, act = '') => `<div class="ph"><div><h1>${title}</h1><p class="mut small" style="margin:4px 0 0">${desc}</p></div><div class="act">${dvSeg(key, listLabel)}${act}</div></div>`;
const asOf = () => `<p class="small faint" style="text-align:right;margin:4px 0 0">ข้อมูล ณ ${new Date().toLocaleString('th-TH', { dateStyle:'medium', timeStyle:'short' })} · ดึงจากฐานข้อมูลทุกครั้งที่เปิด</p>`;

async function procPR(){
  const { data, error } = await sb.from('purchase_requests').select('*, projects(code,name), budget_lines(code), purchase_orders(id,no,status)').eq('company_id', S.cid).order('created_at', { ascending:false });
  if (error) return fail(error);
  const me = S.user.id, rv = canDecide(['procurement']);
  const acts = x => {
    const o = [], mine = x.requested_by === me;
    if (['draft','returned'].includes(x.status) && (mine || S.isOwner)) o.push(`<button class="btn sm primary" data-prs="${x.id}" data-st="submitted">ส่งขออนุมัติ</button><button class="btn sm ghost" data-prs="${x.id}" data-st="cancelled">ยกเลิก</button>`);
    if (['submitted','reviewed'].includes(x.status) && !mine && rv) {
      if (x.status === 'submitted' && (S.isOwner || can('procurement','r'))) o.push(`<button class="btn sm" data-dec="${x.id}" data-a="review">ตรวจผ่าน</button>`);
      if (S.isOwner || can('procurement','a')) o.push(`<button class="btn sm primary" data-dec="${x.id}" data-a="approve">อนุมัติ</button>`);
      o.push(`<button class="btn sm ghost" data-dec="${x.id}" data-a="return">ตีกลับ</button><button class="btn sm ghost" data-dec="${x.id}" data-a="reject">ไม่อนุมัติ</button>`);
    }
    if (x.status === 'approved' && !(x.purchase_orders || []).length && (S.isOwner || can('procurement','c'))) o.push(`<button class="btn sm accent" data-mkpo="${x.id}">ออก PO</button>`);
    o.push(`<button class="btn sm ghost" data-hist="${x.id}" data-no="${h(x.no)}">ประวัติ</button>`, thrBtn('pr:' + x.id, 'PR ' + x.no));
    return o.join(' ');
  };
  await threadIndex().catch(() => {});
  $('#proc-t').innerHTML = data.length ? `<table><thead><tr><th>เลขที่</th><th>โครงการ</th><th>รายการ</th><th>รหัสงบ</th><th class="num">ยอดตัดงบ</th><th style="min-width:190px">สถานะ / ดำเนินการ</th></tr></thead><tbody>
    ${data.map(x => `<tr><td class="mono">${h(x.no)}<div class="small faint">${thDate(x.pr_date)} · ${h(x.requester_name || '')}</div>${x.ref_no ? `<div class="small mut">อ้างอิง ${h(x.ref_no)}</div>` : ''}</td>
      <td class="mono">${h(x.projects?.code || '')}</td>
      <td style="min-width:200px;max-width:320px">${h((x.items || []).map(i => i.desc).join(' · ').slice(0, 140))}${x.vendor_hint ? `<div class="small mut">ผู้ขาย: ${h(x.vendor_hint)}</div>` : ''}${x.skip_note ? `<div class="small gold" style="color:var(--gold)">${h(x.skip_note)}</div>` : ''}</td>
      <td class="mono">${h(x.budget_lines?.code || '—')}</td>
      <td class="num">${money(Number(x.amount) + (x.vat_included ? Number(x.vat_amount) : 0))}${!x.vat_included && Number(x.vat_amount) ? `<div class="small faint">+VAT ${money(x.vat_amount)} ไม่ตัดงบ</div>` : ''}</td>
      <td>${chip(PR_ST, x.status)}${(x.purchase_orders || []).map(o => `<div class="small mono">${h(o.no)}</div>`).join('')}<div class="gates" style="margin-top:8px">${acts(x)}</div></td></tr>`).join('')}</tbody></table>` : '<div class="empty">ยังไม่มี PR</div>';
  document.querySelectorAll('[data-prs]').forEach(b => b.onclick = async () => {
    const st = b.dataset.st; if (!confirm(st === 'submitted' ? 'ส่ง PR ขออนุมัติ?' : 'ยกเลิก PR นี้?')) return;
    const { error } = await sb.from('purchase_requests').update({ status: st }).eq('id', b.dataset.prs);
    if (error) return fail(error); toast(st === 'submitted' ? 'ส่งขออนุมัติแล้ว' : 'ยกเลิกแล้ว'); pageProc();

  document.querySelectorAll('[data-dec]').forEach(b => b.onclick = () => decide('pr', b.dataset.dec, b.dataset.a, pageProc));
  document.querySelectorAll('[data-hist]').forEach(b => b.onclick = () => showHistory('pr', b.dataset.hist, b.dataset.no));
  bindThrBtns(pageProc);
  document.querySelectorAll('[data-mkpo]').forEach(b => b.onclick = () => dlgNewPO(data.find(x => x.id === b.dataset.mkpo)));
}

    if (['draft','returned'].includes(x.status) && (mine || S.isOwner)) o.push(`<button class="btn sm primary" data-pos="${x.id}" data-st="submitted">ส่งขออนุมัติ</button><button class="btn sm ghost" data-pos="${x.id}" data-st="cancelled">ยกเลิก</button>`);
    if (['submitted','reviewed'].includes(x.status) && !mine && rv) {
      if (x.status === 'submitted' && (S.isOwner || can('procurement','r'))) o.push(`<button class="btn sm" data-dec="${x.id}" data-a="review">ตรวจผ่าน</button>`);
      if (S.isOwner || can('procurement','a')) o.push(`<button class="btn sm primary" data-dec="${x.id}" data-a="approve">อนุมัติ</button>`);

    const st = b.dataset.st; if (!confirm({ submitted:'ส่ง PO ขออนุมัติ?', cancelled:'ยกเลิก PO นี้?', issued:'บันทึกว่าส่ง PO ให้ผู้ขายแล้ว?' }[st])) return;

async function nextNo(table, prefix){
  const { data } = await sb.from(table).select('no').eq('company_id', S.cid).like('no', prefix + '%');
  const n = Math.max(0, ...(data || []).map(r => parseInt(r.no.slice(prefix.length), 10) || 0)) + 1;
  return prefix + String(n).padStart(3, '0');
}

async function dlgNewPR(pid, after){
  const { data: projects } = await sb.from('projects').select('id,code,name').eq('company_id', S.cid).order('code');
  if (!projects?.length) return toast('ยังไม่มีโครงการ', true);

    <div class="field"><label for="pr-r">เหตุผล</label><textarea id="pr-r" class="inp" rows="2"></textarea></div>
    <label class="small" style="display:flex;gap:8px;align-items:center;margin:4px 0"><input type="checkbox" id="pr-vat"> ตัด VAT 7% เข้างบด้วย (ไม่ติ๊ก = VAT เป็นภาษีซื้อขอคืนได้ ไม่ตัดงบ)</label>
    <div class="msg info small" id="pr-sum"></div>
    <label class="small" style="display:flex;gap:8px;align-items:center;margin:4px 0 8px"><input type="checkbox" id="pr-send" checked> ส่งขออนุมัติทันที</label>`, 'บันทึก PR', async dd => {
      const items = [...dd.querySelectorAll('.pr-it')].map(r => ({ desc: r.querySelector('[data-f=d]').value.trim(), qty: +r.querySelector('[data-f=q]').value || 0, unit: r.querySelector('[data-f=u]').value.trim(), price: +r.querySelector('[data-f=p]').value || 0 })).filter(i => i.desc);
      if (!items.length) { toast('ใส่รายการอย่างน้อย 1 รายการ', true); return false; }
      const amt = Math.round(items.reduce((a, i) => a + i.qty * i.price, 0) * 100) / 100, vatInc = $('#pr-vat', dd).checked, vat = Math.round(amt * 7) / 100;
      const line = lines.find(l => l.line_id === $('#pr-l', dd).value);
      if (line && (amt + (vatInc ? vat : 0)) > Number(line.available)) { toast(`ยอดเกินงบคงเหลือ ${money(line.available)} — ขอโอนงบก่อน`, true); return false; }

  if (!runs.data.length) { $('#py-dept').innerHTML = $('#py-t').innerHTML = '<div class="empty">ยังไม่มีงวดเงินเดือน หรือบัญชีนี้ไม่มีสิทธิ์ดู</div>'; return; }
  const run = runs.data.find(r => r.id === S.pyRun) || runs.data[0]; S.pyRun = run.id;
  $('#py-run').innerHTML = runs.data.map(r => `<option value="${r.id}" ${r.id === run.id ? 'selected' : ''}>งวด ${h(PAY_PERIOD(r.period))}</option>`).join('');
  $('#py-run').onchange = e => { S.pyRun = e.target.value; S.pyDept = ''; pagePayroll(); };
  const { data, error } = await sb.from('payroll_lines').select('id,staff_id,employee_code,full_name,dept,position,days,came,income,deduct,total_income,total_deduct,net,status').eq('run_id', run.id).order('employee_code');
  if (error) return fail(error);
  const sum = (a, k) => a.reduce((s, x) => s + Number(x[k] || 0), 0);
  const ok = Math.round(sum(data, 'net')) === Math.round(Number(run.total_net)) && data.length === run.headcount;
  $('#py-stats').innerHTML = `<div class="stat"><small>จำนวนคน</small><b>${data.length}</b></div><div class="stat"><small>รวมรายได้</small><b>${int(run.total_income)}</b></div>
    <div class="stat"><small>รวมรายการหัก</small><b>${int(run.total_deduct)}</b></div><div class="stat"><small>จ่ายสุทธิ</small><b>${int(run.total_net)}</b>
    <div class="small ${ok ? 'faint' : ''}" style="${ok ? '' : 'color:var(--crit)'}">${ok ? 'ยอดรายคนตรงกับยอดงวด' : 'ยอดรายคนไม่ตรงกับยอดงวด — ตรวจสอบ'}</div></div>`;
  const depts = {}; for (const x of data) { const d = depts[x.dept || '—'] ||= { n:0, inc:0, ded:0, net:0 }; d.n++; d.inc += +x.total_income; d.ded += +x.total_deduct; d.net += +x.net; }
  const dk = Object.keys(depts).sort((a, b) => depts[b].net - depts[a].net);
  const drawDept = () => { $('#py-dept').innerHTML = `<table><thead><tr><th>หน่วยงาน</th><th class="num">คน</th><th class="num">รายได้</th><th class="num">หัก</th><th class="num">สุทธิ</th><th class="num">สัดส่วน</th></tr></thead><tbody>
    ${dk.map(k => `<tr class="clk" data-dp="${h(k)}" ${S.pyDept === k ? 'style="background:var(--surface2)"' : ''}><td>${h(k)}</td><td class="num">${depts[k].n}</td><td class="num mono">${int(depts[k].inc)}</td><td class="num mono">${int(depts[k].ded)}</td><td class="num mono"><b>${int(depts[k].net)}</b></td><td class="num small mut">${(depts[k].net / run.total_net * 100).toFixed(1)}%</td></tr>`).join('')}
    </tbody></table>`;
    document.querySelectorAll('[data-dp]').forEach(r => r.onclick = () => { S.pyDept = S.pyDept === r.dataset.dp ? '' : r.dataset.dp; $('#py-d').value = S.pyDept; drawDept(); draw(); }); };
  $('#py-d').innerHTML = `<option value="">ทุกหน่วยงาน (${dk.length})</option>` + [...dk].sort((a, b) => a.localeCompare(b, 'th')).map(k => `<option value="${h(k)}">${h(k)}</option>`).join('');
  $('#py-d').value = S.pyDept || ''; if (S.pyS) $('#py-s').value = S.pyS;
  const filt = () => { const q = (S.pyQ || '').toLowerCase();
    return data.filter(x => (!S.pyDept || (x.dept || '—') === S.pyDept) && (!S.pyS || x.status === S.pyS) && (!q || [x.employee_code, x.full_name, x.position].join(' ').toLowerCase().includes(q))); };
  const draw = () => { const rows = filt();
    $('#py-n').textContent = `แสดง ${rows.length} คน · สุทธิ ${int(sum(rows, 'net'))}`;
    $('#py-t').innerHTML = rows.length ? `<table><thead><tr><th>รหัส</th><th>ชื่อ-สกุล</th><th>ตำแหน่ง / หน่วยงาน</th><th class="num">มาทำงาน</th><th class="num">รายได้</th><th class="num">หัก</th><th class="num">สุทธิ</th><th>สถานะ</th></tr></thead><tbody>
      ${rows.map(x => `<tr class="clk" data-pl="${x.id}"><td class="mono">${h(x.employee_code)}</td><td><b>${h(x.full_name)}</b>${x.staff_id ? '' : '<div class="small faint">ไม่อยู่ในทะเบียนพนักงาน</div>'}</td>
        <td class="small">${h(x.position || '')}<div class="mut">${h(x.dept || '')}</div></td><td class="num small">${x.came ?? '—'}/${x.days ?? '—'}</td>
        <td class="num mono">${int(x.total_income)}</td><td class="num mono">${int(x.total_deduct)}</td><td class="num mono"><b>${int(x.net)}</b></td>
        <td>${x.status === 'Out' ? '<span class="chip">ออกระหว่างงวด</span>' : '<span class="chip good">ทำงาน</span>'}</td></tr>`).join('')}</tbody></table>` : '<div class="empty">ไม่พบรายการ</div>';
    document.querySelectorAll('[data-pl]').forEach(r => r.onclick = () => dlgPayLine(data.find(x => x.id === r.dataset.pl), run)); };
  $('#py-q').oninput = e => { S.pyQ = e.target.value; draw(); };
  $('#py-d').onchange = e => { S.pyDept = e.target.value; drawDept(); draw(); };
  $('#py-s').onchange = e => { S.pyS = e.target.value; draw(); };
  $('#py-csv').onclick = () => {
    const rows = filt(), esc = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
    const csv = '﻿' + [['รหัส','ชื่อ-สกุล','ตำแหน่ง','หน่วยงาน','วันทำงาน','มาทำงาน','รายได้','หัก','สุทธิ','สถานะ'].map(esc).join(','),
      ...rows.map(x => [x.employee_code, x.full_name, x.position, x.dept, x.days, x.came, x.total_income, x.total_deduct, x.net, x.status].map(esc).join(','))].join('\r\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type:'text/csv;charset=utf-8' }));
    a.download = `payroll_${run.period}${S.pyDept ? '_' + S.pyDept.replace(/[^\wก-๙]+/g, '-') : ''}.csv`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  };
  drawDept(); draw();
}

function dlgPayLine(x, run){
  const items = (o, skip) => Object.entries(o || {}).filter(([k]) => !skip.includes(k)).sort((a, b) => b[1] - a[1]);
  const inc = items(x.income, PAY_SUM_KEYS), ded = items(x.deduct, PAY_SUM_KEYS);
  const tbl = (rows, total, lab) => `<table><tbody>${rows.map(([k, v]) => `<tr><td>${h(k)}</td><td class="num mono">${money(v)}</td></tr>`).join('') || '<tr><td class="mut" colspan="2">ไม่มีรายการ</td></tr>'}
    <tr><td><b>${lab}</b></td><td class="num mono"><b>${money(total)}</b></td></tr></tbody></table>`;
  const taxBase = (x.deduct || {})['คิดภงด'];
  dialog(`${x.employee_code} · ${x.full_name}`, `
    <p class="small mut" style="margin:0 0 10px">${h(x.position || '')} · ${h(x.dept || '')} · งวด ${h(PAY_PERIOD(run.period))} · มาทำงาน ${x.came ?? '—'} จาก ${x.days ?? '—'} วัน${x.status === 'Out' ? ' · <b>ออกระหว่างงวด</b>' : ''}</p>
    <div class="row" style="align-items:flex-start"><div class="field"><label>รายได้</label>${tbl(inc, x.total_income, 'รวมรายได้')}</div>
      <div class="field"><label>รายการหัก</label>${tbl(ded, x.total_deduct, 'รวมหัก')}</div></div>
    <div class="msg" style="margin-top:10px">จ่ายสุทธิ <b class="mono">${money(x.net)}</b> บาท</div>
    ${taxBase != null ? `<p class="small faint" style="margin:8px 0 0">ฐานคำนวณภาษี (คิดภงด) ${money(taxBase)} — เป็นฐานภาษี ไม่ใช่รายการหัก จึงไม่นับรวมในยอดหัก</p>` : ''}`, 'ปิด', () => true).querySelector('button[value=cancel]').remove();
}

function dlgStaff(s){
  const isNew = !s; s = s || { status:'active' };
  const certs = (s.certs || []).filter(c => typeof c === 'string').join('\n');
  const lic = (s.certs || []).filter(c => typeof c === 'object' && c.license);
  dialog(isNew ? 'เพิ่มพนักงาน' : `แก้ไข ${s.employee_code}`, `
    <div class="row"><div class="field" style="max-width:170px"><label for="s-code">รหัสพนักงาน</label><input id="s-code" class="inp mono" required pattern="[A-Z0-9-]{3,20}" value="${h(s.employee_code || '')}" ${isNew ? '' : 'disabled'}></div>
      <div class="field"><label for="s-name">ชื่อ-สกุล (มีคำนำหน้า)</label><input id="s-name" class="inp" required value="${h(s.full_name || '')}"></div>
      <div class="field" style="max-width:140px"><label for="s-nick">ชื่อเล่น</label><input id="s-nick" class="inp" value="${h(s.nickname || '')}"></div></div>
    <div class="row"><div class="field"><label for="s-pos">ตำแหน่ง</label><input id="s-pos" class="inp" value="${h(s.position || '')}"></div>
      <div class="field"><label for="s-type">ประเภทการจ้าง</label><input id="s-type" class="inp" list="s-types" value="${h(s.emp_type || '')}"><datalist id="s-types"><option>พนักงานรายเดือน</option><option>เหมาจ่าย</option><option>นักศึกษาฝึกงาน</option></datalist></div></div>
    <div class="row"><div class="field"><label for="s-dept">หน่วยงาน (ตาม Payroll)</label><input id="s-dept" class="inp" value="${h(s.dept || '')}"></div>
      <div class="field"><label for="s-site">หน้างาน</label><input id="s-site" class="inp" list="s-sites" value="${h(s.site || '')}"><datalist id="s-sites">${[...new Set((S.staff || []).map(x => x.site).filter(Boolean))].map(x => `<option>${h(x)}</option>`).join('')}</datalist></div></div>
    <div class="row"><div class="field"><label for="s-start">วันเริ่มงาน</label><input id="s-start" class="inp" type="date" value="${h(s.start_date || '')}"></div>
      <div class="field"><label for="s-st">สถานะ</label><select id="s-st" class="inp">${Object.entries(STAFF_ST).map(([k, v]) => `<option value="${k}" ${k === s.status ? 'selected' : ''}>${v[0]}</option>`).join('')}</select></div>
      <div class="field"><label for="s-end">วันสิ้นสุด (ถ้าลาออก)</label><input id="s-end" class="inp" type="date" value="${h(s.end_date || '')}"></div></div>
    <div class="row"><div class="field"><label for="s-edu">การศึกษา</label><input id="s-edu" class="inp" value="${h(s.education || '')}"></div>
      <div class="field" style="max-width:160px"><label for="s-sso">ประกันสังคม</label><select id="s-sso" class="inp">${['มี','ไม่มี','กำลังแจ้งออก'].map(x => `<option ${x === s.sso_status ? 'selected' : ''}>${x}</option>`).join('')}</select></div></div>
    <div class="field"><label for="s-certs">ใบรับรอง / การอบรม (บรรทัดละ 1 รายการ)</label><textarea id="s-certs" class="inp" rows="3">${h(certs)}</textarea></div>
    ${lic.length ? `<p class="small mut">ใบอนุญาต: ${lic.map(l => h(l.license)).join(' · ')}</p>` : ''}
    <div class="field"><label for="s-note">หมายเหตุ</label><input id="s-note" class="inp" value="${h(s.note || '')}"></div>`, 'บันทึก', async d => {
      const st = $('#s-st', d).value;
      if (st === 'resigned' && !$('#s-end', d).value) { toast('ใส่วันสิ้นสุดการจ้างด้วย', true); return false; }
      const row = { full_name: $('#s-name', d).value.trim(), nickname: $('#s-nick', d).value.trim() || null, position: $('#s-pos', d).value.trim() || null,
        emp_type: $('#s-type', d).value.trim() || null, dept: $('#s-dept', d).value.trim() || null, site: $('#s-site', d).value.trim() || null,
        start_date: $('#s-start', d).value || null, end_date: $('#s-end', d).value || null, status: st, education: $('#s-edu', d).value.trim() || null,
        sso_status: $('#s-sso', d).value, note: $('#s-note', d).value.trim() || null,
        certs: [...$('#s-certs', d).value.split('\n').map(x => x.trim()).filter(Boolean), ...lic] };
      const { error } = isNew
        ? await sb.from('staff').insert({ ...row, company_id: S.cid, employee_code: $('#s-code', d).value.trim().toUpperCase() })
        : await sb.from('staff').update(row).eq('id', s.id);
      if (error) { fail(/duplicate|unique/i.test(error.message) ? { message:'รหัสพนักงานนี้มีอยู่แล้ว' } : error); return false; }
      if (!isNew && st === 'resigned' && s.user_id && S.isOwner && confirm('ระงับบัญชีเข้าระบบของพนักงานคนนี้ด้วย?')) {
        await sb.from('memberships').update({ status:'suspended' }).eq('company_id', S.cid).eq('user_id', s.user_id);
      }
      toast('บันทึกแล้ว'); pageStaff();
    });
}

/* ---------- users & positions ---------- */
async function pageUsers(){
  if (dvIs('users')) return dashUsers();
  const el = $('#page');
  el.innerHTML = `<div class="ph"><div><h1>ผู้ใช้และสิทธิ์</h1><p class="mut small" style="margin:4px 0 0">ผู้เสนอ ผู้ตรวจ ผู้อนุมัติต้องเป็นคนละคน · A* ใช้ได้เมื่อเจ้าของยืนยัน DOA แล้วเท่านั้น · บัญชี AI ได้เฉพาะ AI01–AI03 และอนุมัติไม่ได้</p></div>
    <div class="act" id="u-act">${dvSeg('users','รายชื่อผู้ใช้')}${canAdmin() ? '<button class="btn accent hidden" id="b-prov"></button><button class="btn" id="b-add">+ บัญชีอีเมล</button>' : ''}</div></div>
    <div class="msg info small">ชื่อผู้ใช้ = ชื่อ-สกุลจากทะเบียนพนักงาน · รหัสผ่านเริ่มต้น = erp + รหัสพนักงาน · ตำแหน่งที่เห็นเงินหรืออนุมัติได้ (A*, HR/Payroll, การเงิน, SY01, เจ้าของ) ต้องเปลี่ยนรหัสและตั้งแอปยืนยันตัวตนก่อน ฐานข้อมูลจึงยอมให้เห็นข้อมูล</div>
    <div class="panel"><div class="tw" id="ut"><div class="empty">กำลังโหลด…</div></div></div>`;
  const ab = $('#b-add'); if (ab) ab.onclick = dlgAddMember; bindDv(pageUsers);
  if (canAdmin()) sb.rpc('staff_without_login', { p_company: S.cid }).then(({ data: n }) => {
    const pb = $('#b-prov'); if (!pb || !n) return;
    pb.textContent = `สร้างบัญชีจากทะเบียนพนักงาน (${n} คน)`; pb.classList.remove('hidden');
    pb.onclick = async () => {
      if (!confirm(`สร้างบัญชีให้พนักงาน ${n} คน? ชื่อผู้ใช้ = ชื่อ-สกุล รหัสผ่าน = erp + รหัสพนักงาน`)) return;
      pb.disabled = true;
      const { data: c, error } = await sb.rpc('provision_logins', { p_company: S.cid });
      if (error) { pb.disabled = false; return fail(error); }
      toast(`สร้างบัญชีแล้ว ${c} คน`); pageUsers();
    };
  });
  const { data, error } = await sb.rpc('company_members2', { p_company: S.cid });
  if (error) return fail(error);
  S.members = data;
  const posTitle = c => (S.catalog.find(p => p.code === c) || {}).title || '';
  $('#ut').innerHTML = `<table><thead><tr><th>ชื่อผู้ใช้</th><th>รหัสพนักงาน</th><th>สถานะ</th><th>รหัสผ่าน</th><th>ตำแหน่ง (V3)</th><th>ล็อกอินล่าสุด</th>${canAdmin() ? '<th></th>' : ''}</tr></thead><tbody>
    ${data.map(m => `<tr>
      <td><b>${h(m.full_name || '—')}</b>${m.email ? `<div class="small mut">${h(m.email)}</div>` : ''}</td>
      <td class="mono">${h(m.employee_code || '—')}</td>
      <td>${m.role === 'owner' ? '<span class="chip amber">เจ้าของ</span>' : m.status === 'active' ? '<span class="chip good">ใช้งาน</span>' : m.status === 'invited' ? '<span class="chip gold">รอรับคำเชิญ</span>' : '<span class="chip crit">ระงับ</span>'}</td>
      <td>${m.employee_code ? (m.default_password ? '<span class="chip">เริ่มต้น</span>' : '<span class="chip good">เปลี่ยนแล้ว</span>') : '<span class="small faint">—</span>'}</td>
      <td><div class="gates">${(m.positions || []).map(p => `<span class="chip ${p.active ? (p.doa ? 'amber' : 'blue') : ''}" title="${h(posTitle(p.code))}${p.doa ? ' · DOA ' + (p.limit ? money(p.limit) : 'ไม่จำกัดวงเงิน') : ''}">${h(p.code)}${p.doa ? ' A*' : ''}${S.isOwner ? ` <button aria-label="เอา ${h(p.code)} ออก" data-unassign="${p.id}">×</button>` : ''}</span>`).join('') || '<span class="small faint">—</span>'}</div></td>
      <td class="small">${m.last_sign_in ? new Date(m.last_sign_in).toLocaleString('th-TH', { dateStyle:'medium', timeStyle:'short' }) : '—'}</td>
      ${canAdmin() ? `<td style="white-space:nowrap">${m.role !== 'owner' ? `<button class="btn sm" data-assign="${m.user_id}">+ ตำแหน่ง</button>
        ${m.employee_code && m.user_id !== S.user.id ? `<button class="btn sm ghost" data-reset="${m.user_id}">รีเซ็ตรหัส</button>` : ''}
        ${m.user_id !== S.user.id ? `<button class="btn sm ghost" data-susp="${m.user_id}" data-st="${m.status}">${m.status === 'suspended' ? 'คืนสิทธิ์' : 'ระงับ'}</button>` : ''}` : ''}</td>` : ''}
    </tr>`).join('')}</tbody></table>`;
  document.querySelectorAll('[data-assign]').forEach(b => b.onclick = () => dlgAssign(data.find(m => m.user_id === b.dataset.assign)));
  document.querySelectorAll('[data-reset]').forEach(b => b.onclick = async () => {
    const m = data.find(x => x.user_id === b.dataset.reset);
    if (!confirm(`รีเซ็ตรหัสผ่านของ ${m.full_name} กลับเป็น erp + รหัสพนักงาน?`)) return;
    const { error } = await sb.rpc('reset_login_password', { p_company: S.cid, p_user: m.user_id });
    if (error) return fail(error); toast('รีเซ็ตแล้ว'); pageUsers();
  });
  document.querySelectorAll('[data-unassign]').forEach(b => b.onclick = async () => {
    if (!confirm('เอาตำแหน่งนี้ออก?')) return;
    const { error } = await sb.from('position_assignments').delete().eq('id', b.dataset.unassign);
    if (error) return fail(error); toast('เอาตำแหน่งออกแล้ว'); pageUsers();
  });
  document.querySelectorAll('[data-susp]').forEach(b => b.onclick = async () => {
    const to = b.dataset.st === 'suspended' ? 'active' : 'suspended';
    if (to === 'suspended' && !confirm('ระงับบัญชีนี้? ผู้ใช้จะเห็นข้อมูลบริษัทไม่ได้จนกว่าจะคืนสิทธิ์')) return;
    const { error } = await sb.from('memberships').update({ status: to }).eq('company_id', S.cid).eq('user_id', b.dataset.susp);
    if (error) return fail(error); pageUsers();
  });
}

function dlgAddMember(){
  dialog('เพิ่มบัญชีอีเมล (ผู้ที่ไม่อยู่ในทะเบียนพนักงาน)', `
    <div class="field"><label for="am-em">อีเมล (สร้างบัญชีใน Supabase → Authentication → Users ก่อน)</label><input id="am-em" class="inp" type="email" required></div>
    <div class="field"><label for="am-nm">ชื่อ-นามสกุล</label><input id="am-nm" class="inp"></div>`, 'เพิ่ม', async d => {
      const { error } = await sb.rpc('add_member', { p_company: S.cid, p_email: $('#am-em', d).value.trim(), p_full_name: $('#am-nm', d).value.trim() || null });
      if (error) { fail(error); return false; }
      toast('เพิ่มแล้ว — ให้ตำแหน่งต่อได้เลย'); pageUsers();

}

function dlgAssign(m){
  const have = new Set((m.positions || []).map(p => p.code));
  const groups = {};
  for (const p of S.catalog) { if (have.has(p.code)) continue; (groups[p.grp] = groups[p.grp] || []).push(p); }
  const d = dialog(`ให้ตำแหน่ง · ${m.full_name || m.email}`, `
    <div class="field"><label for="as-pos">ตำแหน่งตาม Permission Matrix V3</label>
      <select id="as-pos" class="inp" required>${Object.entries(groups).map(([g, ps]) => `<optgroup label="${h(g)}">${ps.map(p => `<option value="${p.code}">${p.code} — ${h(p.title)}</option>`).join('')}</optgroup>`).join('')}</select></div>
    <div id="as-perm" class="small" style="margin:6px 0 10px"></div>
    <div class="field"><label for="as-bu">จำกัดเฉพาะ BU (เว้นว่าง = ทุก BU)</label><select id="as-bu" class="inp" multiple size="3">${S.bus.map(b => `<option value="${h(b.code)}">${h(b.code)} — ${h(b.name)}</option>`).join('')}</select></div>
    <div id="as-doa" class="hidden">
      ${S.isOwner ? `<label class="small" style="display:flex;gap:8px;align-items:center;margin:8px 0"><input type="checkbox" id="as-doak"> ยืนยันอำนาจอนุมัติ (DOA) สำหรับสิทธิ์ A*</label>
      <div class="field"><label for="as-lim">วงเงินอนุมัติสูงสุด (บาท · เว้นว่าง = ไม่จำกัด)</label><input id="as-lim" class="inp mono" inputmode="decimal"></div>`
      : '<div class="msg warn small">ตำแหน่งนี้มีสิทธิ์ A* — ต้องให้เจ้าของบริษัทยืนยัน DOA ก่อนจึงอนุมัติได้</div>'}
    </div>`, 'ให้ตำแหน่ง', async dd => {
      const code = $('#as-pos', dd).value;
      const bu = [...$('#as-bu', dd).selectedOptions].map(o => o.value);
      const doa = S.isOwner && $('#as-doak', dd)?.checked;
      const lim = S.isOwner ? parseFloat(($('#as-lim', dd)?.value || '').replace(/,/g, '')) : NaN;
      const { error } = await sb.from('position_assignments').insert({ company_id: S.cid, user_id: m.user_id, position_code: code,
        bu_codes: bu.length ? bu : null, doa_confirmed: !!doa, doa_limit: doa && !isNaN(lim) ? lim : null, assigned_by: S.user.id });
      if (error) { fail(error); return false; }
      toast(`ให้ ${code} แล้ว`); pageUsers();
    });
  const show = () => {
    const code = $('#as-pos', d).value;
    const rows = S.permRows.filter(r => r.position_code === code && r.raw !== '—');
    $('#as-perm', d).innerHTML = rows.map(r => `<span class="chip" style="margin:2px">${h((MODS.find(m => m[0] === r.module) || [,''])[1])}: ${h(r.raw)}</span>`).join('') || '<span class="faint">ไม่มีสิทธิ์ในโมดูลใด</span>';
    $('#as-doa', d).classList.toggle('hidden', !rows.some(r => r.a));
  };
  $('#as-pos', d).onchange = show; show();
}

/* ---------- V3 catalog ---------- */
function pageV3(){
  const g = S.posGrp;
  const grps = [['all','ทั้งหมด'],['EX','ผู้บริหาร'],['BN','Budget Node'],['OC','OC Node'],['BU','Business Unit'],['SY','ระบบ'],['AI','AI Agent']];
  const rows = S.catalog.filter(p => g === 'all' || p.code.startsWith(g));
  const cell = raw => { if (!raw || raw === '—') return '<span class="pm n">—</span>';
    const cls = raw.includes('A*') ? 'a' : /Recommendation/.test(raw) ? 'v' : /[CEX]/.test(raw.replace(/\(.*?\)/g,'')) ? 'c' : raw.includes('R') ? 'r' : 'v';
    return `<span class="pm ${cls}" title="${h(raw)}">${h(raw.replace('Recommendation only','AI').replace(/ \(.*\)/,'*'))}</span>`; };
  $('#page').innerHTML = `<div class="ph"><div><h1>ตำแหน่งและสิทธิ์ (Permission Matrix V3)</h1><p class="mut small" style="margin:4px 0 0">${S.catalog.length} ตำแหน่ง × 14 โมดูล · * = มีขอบเขต (ชี้เพื่อดู) · AI = แนะนำเท่านั้น</p></div>
    <div class="act"><div class="seg" role="group" aria-label="กลุ่มตำแหน่ง">${grps.map(([k,l]) => `<button data-g="${k}" aria-pressed="${g === k}">${l}</button>`).join('')}</div></div></div>
    <div class="panel"><div class="tw"><table><thead><tr><th>รหัส</th><th>ตำแหน่ง</th>${MODS.map(m => `<th title="${h(m[1])}">${h(m[1].split(' ')[0])}</th>`).join('')}</tr></thead><tbody>
    ${rows.map(p => `<tr><td class="mono">${h(p.code)}</td><td><b>${h(p.title)}</b><div class="small mut">${h(p.purpose || '')}</div></td>
      ${MODS.map(([k]) => `<td>${cell((S.permRows.find(r => r.position_code === p.code && r.module === k) || {}).raw)}</td>`).join('')}</tr>`).join('')}
    </tbody></table></div></div>`;
  document.querySelectorAll('[data-g]').forEach(b => b.onclick = () => { S.posGrp = b.dataset.g; pageV3(); });
}

/* =====================================================================
   start
   ===================================================================== */
sb.auth.onAuthStateChange((ev, session) => {
  // เรียก route เฉพาะตอนสถานะล็อกอินเปลี่ยนจริง (กลับจากลิงก์อีเมล / ออกจากระบบ) ไม่ทำซ้ำตอนต่ออายุโทเคน
  if (ev === 'SIGNED_OUT' && S.user) { S.user = null; setTimeout(viewLogin, 0); }
  if (ev === 'SIGNED_IN' && session && (!S.user || S.user.id !== session.user.id)) setTimeout(route, 0);
});
route().catch(fail);
</script>
